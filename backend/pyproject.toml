[project]
name = "nexus-ops"
version = "0.1.0"
description = "NEXUS — AI-native digital twin & autonomous operations platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Raunit Thakur", email = "raunit.thakur@gmail.com" }]
keywords = ["digital-twin", "simulation", "optimization", "multi-agent", "operations-research", "physical-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "structlog>=24.1",
  "numpy>=2.0",
  "networkx>=3.3",
  "ortools>=9.10",
  "scipy>=1.14",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "orjson>=3.10",
  "typer>=0.12",
  "rich>=13.7",
  "websockets>=12",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.9"]

[project.scripts]
nexus = "nexus.__main__:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "hypothesis>=6.100",
  "matplotlib>=3.9",
  "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "T20"]
ignore = ["RUF012", "B008", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"benchmarks/*" = ["T20"]
"scripts/*" = ["T20"]
"nexus/__main__.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests/", "benchmarks/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: slow tests (benchmarks, large simulations)", "llm: requires a running Ollama"]

[tool.coverage.run]
source = ["nexus"]
omit = ["nexus/__main__.py"]
